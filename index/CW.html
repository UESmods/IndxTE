<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<link rel="icon" href="image/CWpng.png">
		<title>等待中...</title>
	</head>
	<script>
		//判断设备类型：mobile / tablet / desktop
		function getDeviceType(){
			const ua = navigator.userAgent;
			if(/iPad|Android(?!.*Mobile)/i.test(ua)){
				return 'tablet';
			}
			if(/Mobile|iPhone|iPod|Android|BlackBerry|IEMobile|Opera Mini/i.test(ua)){
				return 'mobile';
			}
			return 'desktop';
		}
		const device = getDeviceType();
		if(device == 'mobile'){
			window.location.href = "CwMobile.html";
		}else{
			window.location.href = "CwDesktop.html";
		}
	</script>
	<body>
	</body>
</html>
